name: Backend CI

# 1. Trigger the workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # 2. Specify the operating system for the runner
    runs-on: ubuntu-latest

    steps:
    # 3. Check out your repository code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 4. Install Python 3.11 and cache dependencies to speed up future runs
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    # 5. Install the exact dependencies your application and tests need
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 6. Execute the test suite
    - name: Run Domain & Integration Tests
      env:
        PYTHONPATH: .
      run: |
        pytest tests/ -v --ignore=tests/load
