version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: dars_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: dars_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dars_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Message Broker for Celery)
  redis:
    image: redis:7-alpine
    container_name: dars_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. FastAPI Web Server
  api:
    build: .
    container_name: dars_api
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:supersecretpassword@db:5432/dars_crm
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

  # 4. Celery Worker (Executes background tasks)
  celery_worker:
    build: .
    container_name: dars_celery_worker
    restart: always
    command: celery -A config.celery_app worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:supersecretpassword@db:5432/dars_crm
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

  # 5. Celery Beat (Schedules the weekly RAG Vector DB Sync)
  celery_beat:
    build: .
    container_name: dars_celery_beat
    restart: always
    command: celery -A config.celery_app beat --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:supersecretpassword@db:5432/dars_crm
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

  # 6. Prometheus Time-Series Database
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: dars_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - api

  # 7. Grafana Dashboard
  grafana:
    image: grafana/grafana:10.0.3
    container_name: dars_grafana
    restart: always
    ports:
      - "3001:3000" # Mapped to 3001 so it doesn't clash with Next.js frontend on 3000
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=supersecurepassword
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # 8. Next.js Frontend
  frontend:
    build: 
      context: ./dars-crm-frontend
      dockerfile: Dockerfile
    container_name: dars_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000/api/v1
      - NEXTAUTH_SECRET=supersecretfrontendkey
      - NEXTAUTH_URL=http://localhost:3000
    depends_on:
      - api

# Persistent volumes block
volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
