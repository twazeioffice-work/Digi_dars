version: '3.8'

services:
  web:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://dars_user:dars_password@postgres:5432/dars_db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
      - SECRET_KEY=production_secret_key_change_me_in_env
    depends_on:
      - postgres
      - redis

  celery_worker:
    build: .
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info -Q q_urgent,q_vector_sync,q_llm_batch
    environment:
      - DATABASE_URL=postgresql://dars_user:dars_password@postgres:5432/dars_db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
      - SECRET_KEY=production_secret_key_change_me_in_env
    depends_on:
      - postgres
      - redis

  celery_beat:
    build: .
    command: celery -A app.core.celery_app.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://dars_user:dars_password@postgres:5432/dars_db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BACKEND_URL=redis://redis:6379/1
      - SECRET_KEY=production_secret_key_change_me_in_env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: dars_postgres
    environment:
      - POSTGRES_USER=dars_user
      - POSTGRES_PASSWORD=dars_password
      - POSTGRES_DB=dars_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dars_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
