# /etc/nginx/sites-available/darscrm

# 1. Map block to support WebSocket protocol upgrades dynamically
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 2. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name app.darscrm.com;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

# 3. Main HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.darscrm.com;

    # SSL Termination (Assuming you use Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/app.darscrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.darscrm.com/privkey.pem;

    # Strong SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- ROUTING RULES ---

    # A. Route API traffic to FastAPI (Docker port 8000)
    location /api/ {
        proxy_pass http://127.0.0.1:8000; # No trailing slash preserves the /api/ prefix
        
        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Support (Crucial for Real-Time AI Notifications)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Prevent WebSockets from dropping after 60 seconds of inactivity
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # B. Route Swagger Docs to FastAPI
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }
    
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # C. Route all other traffic to Next.js Frontend (Docker port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js also uses WebSockets for Hot Module Replacement in dev
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
